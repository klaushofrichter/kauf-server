name: Deploy production

on:
  push:
    branches: [production]

permissions:
  contents: write   # create the release tag
  packages: write

jobs:
  deploy:
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # release notes are computed from history and tags

      - name: Install kubectl and configure in-cluster access
        run: |
          set -euo pipefail
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client
          SA_DIR=/var/run/secrets/kubernetes.io/serviceaccount
          kubectl config set-cluster in-cluster \
            --server=https://kubernetes.default.svc \
            --certificate-authority="${SA_DIR}/ca.crt"
          kubectl config set-credentials deploy-sa --token="$(cat "${SA_DIR}/token")"
          kubectl config set-context in-cluster --cluster=in-cluster --user=deploy-sa --namespace=bulbs
          kubectl config use-context in-cluster

      - name: Generate the version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Calendar versioning, generated here rather than carried in the
          # sources: nothing to remember to bump, and the number says when the
          # build shipped. Dated in Central time so an evening deploy is not
          # filed under tomorrow.
          DATE=$(TZ=America/Chicago date +%Y.%m.%d)
          # Same-day counter, derived from the releases that already exist —
          # the tags are the state, so nothing needs storing.
          TODAY=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                    --json tagName -q '.[].tagName' | grep -c "^v${DATE}\." || true)
          VERSION="${DATE}.$((TODAY + 1))"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # latest is published here rather than from main, so that pulling it
          # gives what is actually deployed rather than an untested build.
          # APP_VERSION has no "v" prefix - it's what /health and the web UI
          # display, matching the bare calendar-version format directly; the
          # git/image tags below keep the conventional "v" prefix separately.
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.version }}
          tags: |
            ghcr.io/klaushofrichter/kauf-server:${{ github.sha }}
            ghcr.io/klaushofrichter/kauf-server:v${{ steps.ver.outputs.version }}
            ghcr.io/klaushofrichter/kauf-server:latest

      - name: Prune old Docker images
        run: docker system prune -af --filter "until=168h" || true

      - name: Update kube-setup manifest and deploy
        env:
          KUBE_SETUP_DEPLOY_TOKEN: ${{ secrets.KUBE_SETUP_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/kube-setup-deploy
          git clone "https://x-access-token:${KUBE_SETUP_DEPLOY_TOKEN}@github.com/klaushofrichter/kube-setup.git" /tmp/kube-setup-deploy
          cd /tmp/kube-setup-deploy
          sed -i "s|image: ghcr.io/klaushofrichter/kauf-server:.*|image: ghcr.io/klaushofrichter/kauf-server:${SHA}|" manifests/bulbs/bulbs-ksvc.yaml
          grep -q "image: ghcr.io/klaushofrichter/kauf-server:${SHA}$" manifests/bulbs/bulbs-ksvc.yaml \
            || { echo "::error::manifest image line did not update to ${SHA}"; exit 1; }
          git config user.name "kauf-server-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifests/bulbs/bulbs-ksvc.yaml
          if git diff --cached --quiet; then
            echo "No manifest change (image tag already up to date) — skipping commit/push."
          else
            git commit -m "Deploy kauf-server ${SHA}"
            git push
          fi
          kubectl apply -f manifests/bulbs/bulbs-ksvc.yaml
          rm -rf /tmp/kube-setup-deploy

      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl wait --for=condition=Ready ksvc/bulbs -n bulbs --timeout=120s
          kubectl get ksvc bulbs -n bulbs

      - name: Smoke-test the public endpoints
        id: smoke
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          BASE=https://bulbs.skylar.technology
          # The deployed build must be the one this run just stamped, so the
          # version is checked inside the retry loop rather than once after it:
          # ingress can still answer from the previous revision for a moment
          # after the ksvc reports Ready, and that is a race to wait out, not a
          # deploy failure.
          code=""; served=""; ok=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$BASE/health" || true)
            if [ "$code" = "200" ]; then
              # grep -o, not a greedy sed: this pins to the "version" key itself
              # rather than to the last thing in the payload that looks like one.
              # `|| true`: pipefail would otherwise turn a version-less body
              # (or head closing the pipe) into a hard failure instead of a retry.
              served=$(grep -o '"version":"[^"]*"' /tmp/health.json | head -1 | cut -d'"' -f4 || true)
              if [ "$served" = "$VERSION" ]; then
                ok=1; echo "health ok, serving ${served}"; break
              fi
              echo "still serving ${served:-unknown}, waiting for ${VERSION} (retry ${i}/10)"
            else
              echo "health not ready (HTTP ${code}), retry ${i}/10"
            fi
            sleep 6
          done
          [ -n "$ok" ] || {
            echo "::error::/health never reported ${VERSION} (last: HTTP ${code:-none}, version ${served:-none})"
            exit 1
          }
          # Unlike a public site, GET / here is behind Google OAuth, so 302 to
          # the sign-in flow is the correct healthy answer and the only one we
          # accept. That makes this an auth-enforcement check as much as a
          # liveness one: a 200 would mean the UI had become world-readable.
          page=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/")
          [ "$page" = "302" ] || {
            echo "::error::public page returned ${page}, expected 302 to Google sign-in"
            exit 1
          }
          echo "public page ok (${page} -> sign-in redirect, auth still enforced)"
          # Recorded for the release notes below. The value of writing this into
          # the release is that it is evidence tied to a moment: this build
          # answered on the public URL at this timestamp. Reading it later beats
          # trusting that a green tick somewhere once meant something.
          {
            echo "served_version=$served"
            echo "page_code=$page"
            echo "base=$BASE"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          SERVED: ${{ steps.smoke.outputs.served_version }}
          PAGE_CODE: ${{ steps.smoke.outputs.page_code }}
          BASE: ${{ steps.smoke.outputs.base }}
          CHECKED_AT: ${{ steps.smoke.outputs.checked_at }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already released — version not bumped, skipping."
            exit 0
          fi
          # Notes: whatever was curated under Unreleased, then the commits
          # since the previous release. Neither needs maintaining for a release
          # to be readable.
          : > /tmp/notes.md
          awk '
            /^## \[Unreleased\]/ { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' CHANGELOG.md | sed '/^[[:space:]]*$/d' > /tmp/curated.md
          if [ -s /tmp/curated.md ]; then
            cat /tmp/curated.md >> /tmp/notes.md
            printf '\n' >> /tmp/notes.md
          fi
          PREV=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                   --json tagName -q '.[0].tagName' 2>/dev/null || true)
          printf '### Changes\n\n' >> /tmp/notes.md
          if [ -n "$PREV" ] && git rev-parse "$PREV" >/dev/null 2>&1; then
            git log --no-merges --pretty='- %s' "${PREV}..HEAD" >> /tmp/notes.md
            printf '\n**Full diff**: %s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$PREV" "$TAG" >> /tmp/notes.md
          else
            git log --no-merges --pretty='- %s' -20 >> /tmp/notes.md
          fi
          # Only what this deploy itself observed - no suite counts pulled from
          # another workflow's run, which would be evidence about a different
          # set of bits at a different time.
          printf '\n### Verified at release\n\n' >> /tmp/notes.md
          printf -- '- Rollout: `ksvc/bulbs` reached Ready\n' >> /tmp/notes.md
          printf -- '- `GET %s/health` -> 200, reported version `%s`, matching the build this run stamped\n' \
            "$BASE" "$SERVED" >> /tmp/notes.md
          printf -- '- `GET %s/` -> %s to Google sign-in, so the UI is serving and still auth-gated\n' \
            "$BASE" "$PAGE_CODE" >> /tmp/notes.md
          printf -- '- Checked at %s by [run %s](%s/%s/actions/runs/%s)\n' \
            "$CHECKED_AT" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/notes.md
          printf '\nImage: `ghcr.io/klaushofrichter/kauf-server:%s`\n' "$TAG" >> /tmp/notes.md
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file /tmp/notes.md
          echo "Released $TAG"
