name: Build and publish image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # This job publishes ONLY the moving `main` tag.
          #
          # It used to also push :<sha>, which the cluster manifest pins -
          # and because main and production carry the same commit after a
          # promotion, this job would rebuild that commit and re-push the
          # same :<sha> seconds after the release job had published it. The
          # released artifact was replaced in the registry underneath a
          # running service, without APP_VERSION, so /health reported "dev".
          #
          # Nothing errors when that happens, which is what makes it bad: the
          # service keeps serving the old image until something restarts the
          # pod - a reboot, an eviction, an OOM kill - and then it quietly
          # comes back as the main build while the release notes still claim
          # the released build answered correctly.
          #
          # :<sha>, :v<version> and :latest are now written only by
          # deploy-production.yml, so the tag the cluster pins is immutable
          # in practice.
          tags: |
            ghcr.io/klaushofrichter/kauf-server:main
